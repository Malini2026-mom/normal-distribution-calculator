<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Normal Distribution Calculator</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.11.1/distrib/jsxgraph.css"><style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:12px;color:#333;background:white}.calculator{max-width:750px;border:1px solid #bdbdbd;padding:10px 12px 14px}.graph{width:100%;height:235px;border:0;background:white}.controls{display:grid;grid-template-columns:190px 1fr;gap:8px 18px;margin-top:2px;font-size:13px}.numbers label{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-bottom:4px;white-space:nowrap}.numbers input{width:96px}.modes{display:flex;flex-wrap:wrap;align-items:center;gap:9px 15px;margin-bottom:6px}.modes label{white-space:nowrap}.modes input{accent-color:#7466db;vertical-align:middle}.entry{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:6px 0}.entry input{width:100px}.entry label{min-width:136px;text-align:right}.value{color:#17b928;font-size:16px;font-weight:600;text-align:center;margin:8px 0 2px}.hint{font-size:11px;color:#777;text-align:center}.error{color:#a22}.controls input[type=number]{height:24px;padding:2px 5px;border:1px solid #c9c9c9;border-radius:3px;color:#333;background:#fff}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:7px}.buttons button{padding:5px 10px;background:#f8f8f8;border:1px solid #ccc;border-radius:4px;cursor:pointer}.buttons button:hover{background:#eee}@media(max-width:540px){.controls{grid-template-columns:1fr}.numbers{display:flex;flex-wrap:wrap;gap:5px 10px}.numbers label{justify-content:flex-start}.graph{height:210px}.entry label{text-align:left;min-width:auto}}
</style></head><body><main class="calculator"><div id="jxgbox" class="jxgbox graph" aria-label="Interactive normal distribution graph"></div><div class="controls"><div class="numbers"><label>Mean: μ = <input id="mu" type="number" value="412" step="any"></label><label>Std. Deviation: σ = <input id="sigma" type="number" value="13" min="0.000001" step="any"></label></div><div><div class="modes"><label><input type="checkbox" id="find"> Find Probability</label><label><input type="checkbox" id="inverse" checked> Inverse Normal</label></div><div class="modes"><label><input type="checkbox" id="left" checked> Left Tail</label><label><input type="checkbox" id="inside"> Inside</label><label><input type="checkbox" id="outside"> Outside</label><label><input type="checkbox" id="right"> Right Tail</label></div><div class="entry" id="probEntry"><label for="prob">Probability as decimal =</label><input id="prob" type="number" value="0.55" min="0" max="1" step="any"></div><div class="entry" id="boundEntry" hidden><label for="lower">Lower Bound =</label><input id="lower" type="number" value="399" step="any"><label for="upper">Upper Bound =</label><input id="upper" type="number" value="412" step="any"></div><div class="value" id="result">413.6335975091</div></div></div><div class="buttons"><button id="reset">Reset</button><button id="copy">Copy result</button></div><div class="hint" id="status">Inverse Normal: enter probability to calculate boundary value.</div></main><script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.11.1/distrib/jsxgraphcore.js"></script><script>
(()=>{'use strict';const el=id=>document.getElementById(id);let board=null,curve=null,area=null,lines=[],tickLabels=[];const initial={mu:'412',sigma:'13',prob:'0.55',lower:'399',upper:'412'};const pdf=z=>Math.exp(-z*z/2)/Math.sqrt(2*Math.PI);
function erf(x){let s=Math.sign(x);x=Math.abs(x);let t=1/(1+0.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x));}
function cdf(z){return .5*(1+erf(z/Math.SQRT2));}
// Acklam inverse standard normal CDF, high accuracy after one Halley refinement.
function inv(p){if(p<=0)return -Infinity;if(p>=1)return Infinity;const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];let q,r,x;if(p<.02425){q=Math.sqrt(-2*Math.log(p));x=(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}else if(p>.97575){q=Math.sqrt(-2*Math.log(1-p));x=-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}else{q=p-.5;r=q*q;x=(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}return x;}
function setExclusive(group,chosen){group.forEach(id=>el(id).checked=(id===chosen));render();}
['find','inverse'].forEach(id=>el(id).addEventListener('change',()=>setExclusive(['find','inverse'],id)));
['left','inside','outside','right'].forEach(id=>el(id).addEventListener('change',()=>setExclusive(['left','inside','outside','right'],id)));
['mu','sigma','prob','lower','upper'].forEach(id=>el(id).addEventListener('input',render));
function fmt(x){return Number.isFinite(x)?Number(x.toFixed(10)).toString():String(x);}
function render(){const mu=Number(el('mu').value),s=Number(el('sigma').value),p=Number(el('prob').value),inverse=el('inverse').checked,mode=['left','inside','outside','right'].find(id=>el(id).checked)||'left';el('probEntry').hidden=!inverse;el('boundEntry').hidden=inverse;const result=el('result'),status=el('status');if(!Number.isFinite(mu)||!Number.isFinite(s)||s<=0||(inverse&&!(p>0&&p<1))){result.textContent='Enter valid values';result.classList.add('error');return;}result.classList.remove('error');let low=-Infinity,high=Infinity,answer,regions=[];if(inverse){if(mode==='left'){high=mu+s*inv(p);answer=high;regions=[[-Infinity,high]];}else if(mode==='right'){low=mu+s*inv(1-p);answer=low;regions=[[low,Infinity]];}else if(mode==='inside'){low=mu+s*inv((1-p)/2);high=mu+s*inv((1+p)/2);answer=`${fmt(low)} to ${fmt(high)}`;regions=[[low,high]];}else{low=mu+s*inv(p/2);high=mu+s*inv(1-p/2);answer=`${fmt(low)} to ${fmt(high)}`;regions=[[-Infinity,low],[high,Infinity]];}}else{low=Number(el('lower').value);high=Number(el('upper').value);if(mode==='left'){answer=cdf((high-mu)/s);regions=[[-Infinity,high]];}else if(mode==='right'){answer=1-cdf((low-mu)/s);regions=[[low,Infinity]];}else if(high<=low){result.textContent='Upper bound must exceed lower bound';result.classList.add('error');return;}else if(mode==='inside'){answer=cdf((high-mu)/s)-cdf((low-mu)/s);regions=[[low,high]];}else{answer=cdf((low-mu)/s)+1-cdf((high-mu)/s);regions=[[-Infinity,low],[high,Infinity]];}}result.textContent=typeof answer==='number'?fmt(answer):answer;status.textContent=inverse?'Inverse Normal: calculated boundary value'+(mode==='inside'||mode==='outside'?'s.':'.'):'Find Probability: shaded area as a decimal.';draw(mu,s,regions,[low,high].filter(Number.isFinite));}
function draw(mu,s,regions,bounds){if(!board){el('jxgbox').textContent='Loading JSXGraph…';return;}board.suspendUpdate();if(curve)board.removeObject(curve);if(area)board.removeObject(area);for(const l of lines)board.removeObject(l);for(const t of tickLabels)board.removeObject(t);lines=[];tickLabels=[];let xmin=mu-3.8*s,xmax=mu+3.8*s;for(const v of bounds){xmin=Math.min(xmin,v-.3*s);xmax=Math.max(xmax,v+.3*s);}const ymax=1/(s*Math.sqrt(2*Math.PI));board.setBoundingBox([xmin,ymax*1.27,xmax,-ymax*.2],false);const f=x=>Math.exp(-.5*((x-mu)/s)**2)/(s*Math.sqrt(2*Math.PI));const pathx=[],pathy=[];for(let j=0;j<regions.length;j++){let [a,b]=regions[j];a=Math.max(xmin,Number.isFinite(a)?a:xmin);b=Math.min(xmax,Number.isFinite(b)?b:xmax);if(b<=a)continue;const n=130;pathx.push(a);pathy.push(0);for(let i=0;i<=n;i++){let x=a+(b-a)*i/n;pathx.push(x);pathy.push(f(x));}pathx.push(b);pathy.push(0);pathx.push(NaN);pathy.push(NaN);}if(pathx.length)area=board.create('curve',[pathx,pathy],{strokeWidth:0,fillColor:'#ec6464',fillOpacity:.35,highlight:false,fixed:true});curve=board.create('functiongraph',[f,xmin,xmax],{strokeColor:'#dc3030',strokeWidth:3,highlight:false,fixed:true});for(let k=-3;k<=3;k++){let x=mu+k*s;lines.push(board.create('segment',[[x,0],[x,ymax*.98]],{strokeColor:'#999',dash:2,strokeWidth:1,highlight:false,fixed:true}));tickLabels.push(board.create('text',[x,-ymax*.075,fmt(x)],{fontSize:11,anchorX:'middle',fixed:true,highlight:false}));}for(const x of bounds){lines.push(board.create('segment',[[x,0],[x,f(x)]],{strokeColor:'#df3737',strokeWidth:2,highlight:false,fixed:true}));}board.unsuspendUpdate();}
el('reset').addEventListener('click',()=>{for(const [k,v] of Object.entries(initial))el(k).value=v;el('inverse').checked=true;el('find').checked=false;el('left').checked=true;['inside','outside','right'].forEach(id=>el(id).checked=false);render();});el('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(el('result').textContent);el('status').textContent='Result copied.';}catch{el('status').textContent='Select the green result to copy it.';}});
if(window.JXG){board=JXG.JSXGraph.initBoard('jxgbox',{boundingbox:[360,.05,465,-.008],axis:false,showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false},keepaspectratio:false});render();}else{el('jxgbox').textContent='JSXGraph could not load. Check your internet connection.';render();}
})();
</script></body></html>
