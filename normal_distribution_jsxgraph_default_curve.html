<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Normal Distribution Calculator</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.11.1/distrib/jsxgraph.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;font:14px Arial,sans-serif;color:#222;background:#fff}.calculator{max-width:760px;border:1px solid #bbb;padding:12px}.graph{width:100%;height:260px;border:0;background:white}.controls{display:grid;grid-template-columns:220px 1fr;gap:6px 12px;margin-top:8px}.parameters{display:flex;flex-direction:column;gap:6px}.line{display:flex;align-items:center;gap:5px;white-space:nowrap}.line label{min-width:105px;text-align:right}.line input{width:95px}.choices{display:flex;align-items:center;flex-wrap:wrap;gap:12px 18px;margin-bottom:9px}.choices label{white-space:nowrap;cursor:pointer}.choices input{accent-color:#6554db;vertical-align:middle;width:17px;height:17px}.entry{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;min-height:30px;align-items:center}.entry label{white-space:nowrap}.entry input{width:105px}input[type=text]{height:26px;border:1px solid #bfc4ca;border-radius:3px;padding:3px 6px;font:14px Arial}.output{text-align:center;font-size:20px;font-weight:500;margin:10px 0 4px;min-height:26px}.output.prob{color:#d71920}.output.inverse{color:#159a24}.output.error{color:#ae2020;font-size:14px}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:5px}.status{font-size:11px;color:#777;text-align:center;flex:1}.buttons{display:flex;gap:7px}button{border:1px solid #ccc;border-radius:4px;background:#f7f7f7;padding:6px 11px;cursor:pointer}button:hover{background:#eaeaea}[hidden]{display:none!important}.jxgbox{touch-action:none}@media(max-width:600px){.controls{grid-template-columns:1fr}.parameters{flex-direction:row;flex-wrap:wrap}.choices{gap:8px 12px}.graph{height:220px}.calculator{padding:6px}}
</style></head><body><main class="calculator" aria-label="Normal Distribution Calculator">
<div id="jxgbox" class="graph" role="img" aria-label="Normal distribution curve and shaded probability region"></div>
<div class="controls"><div class="parameters"><div class="line"><label for="mu">Mean: μ =</label><input id="mu" type="text" inputmode="decimal" placeholder="Mean"></div><div class="line"><label for="sigma">Std. Deviation: σ =</label><input id="sigma" type="text" inputmode="decimal" placeholder="SD"></div></div>
<div><div class="choices" role="group" aria-label="Calculation type"><label><input type="radio" name="calculation" id="find" checked> Find Probability</label><label><input type="radio" name="calculation" id="inverse"> Inverse Normal</label></div>
<div class="choices" role="group" aria-label="Region"><label><input type="radio" name="region" id="left" checked> Left Tail</label><label><input type="radio" name="region" id="inside"> Inside</label><label><input type="radio" name="region" id="outside"> Outside</label><label><input type="radio" name="region" id="right"> Right Tail</label></div>
<div class="entry"><label id="probEntry" hidden>Probability as decimal = <input id="prob" type="text" inputmode="decimal" placeholder="0 to 1"></label><label id="lowerEntry" hidden>Lower Bound is <input id="lower" type="text" inputmode="decimal" placeholder="−∞ or number"></label><label id="upperEntry">Upper Bound is <input id="upper" type="text" inputmode="decimal" placeholder="∞ or number"></label></div></div></div>
<div id="result" class="output prob" aria-live="polite"></div><div class="footer"><div id="status" class="status">Enter the values to calculate.</div><div class="buttons"><button type="button" id="reset">Reset</button><button type="button" id="copy">Copy result</button></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.11.1/distrib/jsxgraphcore.js"></script>
<script>
(()=>{'use strict';
const el=id=>document.getElementById(id);let board=null,objects=[],lastValue=null;
const pdf=z=>Math.exp(-z*z/2)/Math.sqrt(2*Math.PI);
// Standard normal CDF (Abramowitz-Stegun approximation, max error about 7.5e-8).
function cdf(z){if(z===Infinity)return 1;if(z===-Infinity)return 0;if(z===0)return 0.5;const x=Math.abs(z),t=1/(1+0.2316419*x),v=1-pdf(x)*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));return z>=0?v:1-v;}
// Acklam inverse normal approximation, followed by two Newton corrections.
function inv(p){if(p<=0)return -Infinity;if(p>=1)return Infinity;const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];let q,r,x;if(p<0.02425){q=Math.sqrt(-2*Math.log(p));x=(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}else if(p>1-0.02425){q=Math.sqrt(-2*Math.log(1-p));x=-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}else{q=p-.5;r=q*q;x=(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}for(let i=0;i<2;i++){let e=cdf(x)-p;if(Math.abs(e)<1e-8)break;x-=e/pdf(x);}return x;}
const fmt=n=>Number.isFinite(n)?Number(n.toFixed(10)).toString():(n===Infinity?'∞':'−∞');
function parseBound(text){let v=text.trim().toLowerCase().replace(/\s/g,'').replace(/−/g,'-');if(['∞','+∞','infinity','+infinity','inf','+inf'].includes(v))return Infinity;if(['-∞','-infinity','-inf'].includes(v))return -Infinity;if(!v)return NaN;return Number(v);}
function sendResult(value){if(window.parent!==window){window.parent.postMessage({type:'JSXGRAPH_RESULT',value:value},'https://www.myopenmath.com');}}
function showFields(){const inverse=el('inverse').checked,inside=el('inside').checked,outside=el('outside').checked,right=el('right').checked;el('probEntry').hidden=!inverse;el('lowerEntry').hidden=inverse||!(right||inside||outside);el('upperEntry').hidden=inverse||right;}
function clearResult(message){lastValue=null;el('result').textContent='';el('status').textContent=message;draw(0,1,[],[]);}
function render(){showFields();const muText=el('mu').value.trim(),sText=el('sigma').value.trim();if(!muText||!sText){clearResult('Enter the mean and standard deviation.');return;}const mu=Number(muText),s=Number(sText),inverse=el('inverse').checked,mode=['left','inside','outside','right'].find(id=>el(id).checked);if(!Number.isFinite(mu)||!Number.isFinite(s)||s<=0){clearResult('Enter a valid mean and a positive standard deviation.');return;}let low=-Infinity,high=Infinity,answer,regions=[],bounds=[];if(inverse){const pText=el('prob').value.trim();if(!pText){clearResult('Enter a probability between 0 and 1.');return;}const p=Number(pText);if(!Number.isFinite(p)||p<=0||p>=1){clearResult('Probability must be greater than 0 and less than 1.');return;}if(mode==='left'){high=mu+s*inv(p);answer=high;regions=[[-Infinity,high]];bounds=[high];}else if(mode==='right'){low=mu+s*inv(1-p);answer=low;regions=[[low,Infinity]];bounds=[low];}else if(mode==='inside'){low=mu+s*inv((1-p)/2);high=mu+s*inv((1+p)/2);answer=[low,high];regions=[[low,high]];bounds=[low,high];}else{low=mu+s*inv(p/2);high=mu+s*inv(1-p/2);answer=[low,high];regions=[[-Infinity,low],[high,Infinity]];bounds=[low,high];}}
else{if(mode==='left'||mode==='inside'||mode==='outside'){high=parseBound(el('upper').value);if(Number.isNaN(high)){clearResult('Enter an upper bound (a number or ∞).');return;}}if(mode==='right'||mode==='inside'||mode==='outside'){low=parseBound(el('lower').value);if(Number.isNaN(low)){clearResult('Enter a lower bound (a number or −∞).');return;}}if((mode==='inside'||mode==='outside')&&high<=low){clearResult('Upper bound must exceed lower bound.');return;}if(mode==='left'){answer=cdf((high-mu)/s);regions=[[-Infinity,high]];bounds=[high];}else if(mode==='right'){answer=1-cdf((low-mu)/s);regions=[[low,Infinity]];bounds=[low];}else if(mode==='inside'){answer=cdf((high-mu)/s)-cdf((low-mu)/s);regions=[[low,high]];bounds=[low,high];}else{answer=cdf((low-mu)/s)+1-cdf((high-mu)/s);regions=[[-Infinity,low],[high,Infinity]];bounds=[low,high];}answer=Math.max(0,Math.min(1,answer));}
lastValue=answer;el('result').className='output '+(inverse?'inverse':'prob');el('result').textContent=inverse?(Array.isArray(answer)?answer.map(fmt).join(', '):fmt(answer)):Number((answer*100).toFixed(4)).toString()+'%';el('status').textContent=inverse?'Inverse Normal: calculated boundary value'+(Array.isArray(answer)?'s.':'.'):'Find Probability: shaded area as a percentage.';draw(mu,s,regions,bounds);sendResult(answer);}
function draw(mu,s,regions,bounds){if(!board)return;board.suspendUpdate();for(const o of objects)board.removeObject(o);objects=[];if(mu===null){board.unsuspendUpdate();return;}let xmin=mu-3.8*s,xmax=mu+3.8*s;for(const x of bounds){if(Number.isFinite(x)){xmin=Math.min(xmin,x-0.3*s);xmax=Math.max(xmax,x+0.3*s);}}const ymax=1/(s*Math.sqrt(2*Math.PI));board.setBoundingBox([xmin,ymax*1.28,xmax,-ymax*.20],false);const f=x=>pdf((x-mu)/s)/s;const add=(type,args,attr)=>{let o=board.create(type,args,attr);objects.push(o);return o;};for(const [aa,bb] of regions){const a=aa===-Infinity?xmin:Math.max(xmin,aa),b=bb===Infinity?xmax:Math.min(xmax,bb);if(b<=a)continue;let xx=[a],yy=[0];for(let i=0;i<=150;i++){let x=a+(b-a)*i/150;xx.push(x);yy.push(f(x));}xx.push(b);yy.push(0);xx.push(a);yy.push(0);add('curve',[xx,yy],{strokeWidth:0,fillColor:'#e75b5b',fillOpacity:.32,highlight:false,fixed:true,closed:true});}add('functiongraph',[f,xmin,xmax],{strokeColor:'#d82424',strokeWidth:3,highlight:false,fixed:true});for(let k=-3;k<=3;k++){const x=mu+k*s;add('segment',[[x,0],[x,ymax*1.18]],{strokeColor:'#999',dash:2,strokeWidth:1,highlight:false,fixed:true});add('text',[x,-ymax*.09,fmt(x)],{fontSize:12,anchorX:'middle',fixed:true,highlight:false});add('text',[x,ymax*1.18,k===0?'μ':`μ ${k<0?'−':'+'} ${Math.abs(k)===1?'':Math.abs(k)}σ`],{fontSize:12,anchorX:'middle',fixed:true,highlight:false});}for(const x of bounds){if(Number.isFinite(x))add('segment',[[x,0],[x,f(x)]],{strokeColor:'#e02d2d',strokeWidth:2,highlight:false,fixed:true});}board.unsuspendUpdate();}
for(const id of ['mu','sigma','prob','lower','upper'])el(id).addEventListener('input',render);for(const id of ['find','inverse','left','inside','outside','right'])el(id).addEventListener('change',render);
el('reset').addEventListener('click',()=>{for(const id of ['mu','sigma','prob','lower','upper'])el(id).value='';el('find').checked=true;el('left').checked=true;render();});
el('copy').addEventListener('click',async()=>{if(lastValue===null)return;const txt=Array.isArray(lastValue)?lastValue.join(', '):String(lastValue);try{await navigator.clipboard.writeText(txt);el('status').textContent='Result copied.';}catch{el('status').textContent='Copy unavailable in this browser.';}});
if(window.JXG){board=JXG.JSXGraph.initBoard('jxgbox',{boundingbox:[-4,.5,4,-.1],axis:false,showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false},keepaspectratio:false});}else{el('jxgbox').textContent='JSXGraph could not load. Check your connection.';}render();
})();
</script></body></html>
